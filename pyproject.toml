[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "data-qd-150"
version = "0.1.0"
description = "FEFO lot allocation with expiry, holds and shortage reconciliation"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
perishable-fulfillment = "perishable_fulfillment.cli:main"
perishable-book = "perishable_fulfillment.book:main"
perishable-wave = "perishable_fulfillment.wave:main"
perishable-markdown = "perishable_fulfillment.markdown:main"
perishable-recall = "perishable_fulfillment.recall:main"
perishable-coldchain = "perishable_fulfillment.coldchain:main"
perishable-demand-panel = "perishable_fulfillment.demand_panel:main"
[tool.setuptools.packages.find]
where = ["src"]
